# AZCO Icon Server — serves per-cipher custom icons as favicons so that
# official Bitwarden clients (iOS, Android, web, desktop) render them
# without any client-side patches.
#
# Each icon is stored at /data/icons/{hash}.jpg. The hash is the first
# 12 hex chars of SHA-256 over the image content. Requests arrive at
# {hash}.ico.azcocorp.com; we extract the hash from the Host header.
#
# Upload: POST /api/store/{hash}  (Authorization: Bearer <token>)
# Delete: DELETE /api/store/{hash}
# Serve:  GET /favicon.ico  → /data/icons/{hash}.jpg
#         GET /              → minimal HTML with <link rel="icon">

user nginx;

load_module modules/ngx_http_js_module.so;

env AZCO_ICON_TOKEN;

http {
    js_path /etc/nginx/njs/;
    js_import icon from icon.js;

    server_tokens off;

    # Rate limit uploads: 30/min per IP
    limit_req_zone $binary_remote_addr zone=icon_upload:10m rate=30r/m;
    limit_req_status 429;

    server {
        listen 8081 default_server;
        server_name _;

        # Hardening
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # Health check
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # ── Favicon serve path ───────────────────────────────────────
        # Vaultwarden (and browsers) request /favicon.ico from the domain.
        # We extract the hash from the Host header and serve the stored icon.
        location = /favicon.ico {
            js_content icon.serveFavicon;
        }

        # Root page — minimal HTML so VW's icon fetcher can also find the
        # favicon via <link rel="icon"> if it falls back to HTML parsing.
        location = / {
            js_content icon.serveIndex;
        }

        # ── Upload / delete API ──────────────────────────────────────
        location ~ "^/api/store/([a-f0-9]{12})$" {
            limit_except POST DELETE OPTIONS { deny all; }
            limit_req zone=icon_upload burst=10 nodelay;

            # Max icon size: 100 KB (resized JPEG should be ~30-40 KB)
            client_max_body_size 100k;

            js_content icon.handleStore;
        }

        # Deny everything else
        location / { return 404; }
    }
}

events {
    worker_connections 256;
}
