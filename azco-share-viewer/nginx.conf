server {
    listen 8080 default_server;
    server_name _;

    # Hardening
    server_tokens off;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # Static files
    location = / { try_files /index.html =404; }
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location = /index.html { try_files $uri =404; }
    location = /app.js     { try_files $uri =404; }
    location = /styles.css { try_files $uri =404; }

    # Reverse proxy for Send access — the ONLY upstream call.
    # Vaultwarden host is kept internal; recipients never see it.
    location = /api/sends/access/ { return 404; }
    location ~ ^/api/sends/access/([A-Za-z0-9_-]+)$ {
        limit_except POST OPTIONS { deny all; }
        proxy_pass https://vw.securusconverting.com/api/sends/access/$1;
        proxy_set_header Host vw.securusconverting.com;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;  # tighten later if VW cert is internal
        proxy_read_timeout 30s;
        proxy_hide_header Set-Cookie;
    }

    # Deny everything else
    location / { return 404; }
}
