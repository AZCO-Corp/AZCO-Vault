# Rate limit for the Send access proxy: 10 requests/minute per client IP,
# with a small burst to absorb page-load bursts. Zone is 10 MB which fits
# ~160k unique IPs — way more than this will ever need.
limit_req_zone $binary_remote_addr zone=send_access:10m rate=10r/m;
limit_req_status 429;

server {
    listen 8080 default_server;
    server_name _;

    # DNS — required because the proxy_pass below uses a variable.
    # 127.0.0.11 is Docker's embedded DNS; 1.1.1.1 is a public fallback.
    resolver 127.0.0.11 1.1.1.1 valid=60s;
    resolver_timeout 5s;

    # Hardening
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # Static files
    location = / {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files /index.html =404;
    }
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /app.js        { try_files $uri =404; }
    location = /styles.css    { try_files $uri =404; }
    location = /logo-blue.svg { try_files $uri =404; }

    # Reverse proxy for Send access — the ONLY upstream call.
    # Vaultwarden host is kept internal; recipients never see it.
    location = /api/sends/access/ { return 404; }
    location ~ ^/api/sends/access/([A-Za-z0-9_-]+)$ {
        limit_except POST OPTIONS { deny all; }
        limit_req zone=send_access burst=20 nodelay;

        proxy_pass https://vw.securusconverting.com/api/sends/access/$1;
        proxy_set_header Host vw.securusconverting.com;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # TLS verification — VW's cert is a real LE cert via the CF tunnel,
        # so we validate it with the container's CA bundle.
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;

        proxy_read_timeout 30s;
        proxy_hide_header Set-Cookie;
    }

    # Deny everything else
    location / { return 404; }
}
